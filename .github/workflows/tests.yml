name: AIMES CLI tests

on:
  pull_request:
  push:
    branches:
      - main
      - "governance/**"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate release metadata and packaged resources
        run: aimes release validate --root . --format json
      - name: Validate Token-efficiency benchmark suite
        run: aimes evaluation validate examples/evaluation/token-efficiency-suite.yaml
      - name: Validate core rule-following regression suite
        run: aimes evaluation validate examples/evaluation/rule-following-suite.yaml --root . --format json
      - name: Validate UI design governance regression suite
        run: aimes evaluation validate examples/evaluation/ui-quality-governance-suite.yaml --root . --format json
      - name: Validate adapter verification evidence V2 example
        run: |
          aimes adapter validate examples/adapters/verification-evidence.example.yaml --format json
          aimes adapter report examples/adapters/verification-evidence.example.yaml --format json
      - name: Validate Skill contract V2 example
        run: aimes skill validate examples/skills/registry.example.yaml --root . --format json
      - name: Validate Skill execution record example
        run: aimes skill execution validate examples/skills/execution-record.example.yaml --root . --format json
      - name: Validate workflow state machine example
        run: aimes workflow validate examples/workflows/engineering-workflow.example.yaml --root . --format json
      - name: Exercise persistent workflow run transitions
        run: |
          aimes workflow run start examples/workflows/engineering-workflow.example.yaml --record .aimes/workflows/runs/ci-run.json --run-id CI-RUN-001 --task-id CI-TASK-001 --baseline-commit "$(git rev-parse HEAD)" --confirm START --root . --format json
          aimes workflow run validate examples/workflows/engineering-workflow.example.yaml .aimes/workflows/runs/ci-run.json --root . --format json
          aimes workflow run transition examples/workflows/engineering-workflow.example.yaml .aimes/workflows/runs/ci-run.json --event success --approval-ref CI-APPROVAL-001 --evidence-ref CI-REQ-REVIEW-001 --confirm TRANSITION --root . --format json
          aimes workflow run transition examples/workflows/engineering-workflow.example.yaml .aimes/workflows/runs/ci-run.json --event retry --guard-evidence "CI verified retry guard and existing state is safe to retry." --confirm TRANSITION --root . --format json
          aimes workflow run transition examples/workflows/engineering-workflow.example.yaml .aimes/workflows/runs/ci-run.json --event success --evidence-ref CI-IMPLEMENTATION-001 --confirm TRANSITION --root . --format json
          aimes workflow run transition examples/workflows/engineering-workflow.example.yaml .aimes/workflows/runs/ci-run.json --event success --evidence-ref CI-VERIFICATION-001 --confirm TRANSITION --root . --format json
          aimes workflow run validate examples/workflows/engineering-workflow.example.yaml .aimes/workflows/runs/ci-run.json --root . --format json
      - name: Baseline documentation audit (advisory)
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from aimes_cli.docs_check import check_docs
          report = check_docs(Path("."))
          print(json.dumps({
              "ok": report["ok"],
              "summary": report["summary"],
              "sample_findings": report["findings"][:50],
          }, ensure_ascii=False, indent=2))
          PY
