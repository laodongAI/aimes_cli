schema_version: 2
skills:
  - id: SKL-CORE-REQ-001
    name: requirement-cognition
    version: 0.1.0
    file: examples/skills/requirement-cognition/SKILL.md
    purpose: "形成可审查、可验收的需求认知记录"
    triggers: [new_feature, requirement_change, ambiguous_request]
    inputs: [task_id, requirement_source, project_context]
    outputs: [requirement_cognition_record, open_questions, review_report]
    applies_to: [all]
    risk_level: medium
    required_capabilities: [read_project_files]
    forbidden_actions: [approve_requirement, overwrite_user_changes]
    prerequisites: [project_rules_loaded, git_state_checked]
    dependencies: []
    validation_status: UNKNOWN
    evaluation_suite: EVAL-REQ-BASELINE
    evidence: []
    lifecycle_stage: proposed
    stop_conditions:
      - "需求目标、关键约束或验收标准存在阻断级未知时，停止进入实施"
      - "项目权威来源互相冲突且未获得负责人澄清时，停止写操作"
    failure_recovery:
      - "保留已生成的草稿和问题清单，明确标记 BLOCKED"
      - "请求补充缺失输入后，从最后一个已验证步骤恢复"
    completion_criteria:
      - "输出需求认知记录，区分事实、推断、未知和冲突"
      - "每条需求具有可检查的验收标准和来源引用"
      - "未解决问题与审批状态已明确记录"
    approval_required: true
    side_effects:
      - "仅生成分析记录，不自动批准需求或覆盖用户文件"
    idempotency: guarded
