schema_version: 1
enabled: true
# Advisory by default. Set enforce: true after reviewing baseline findings.
enforce: false
# WARNING or ERROR. Only used when enforce is true.
fail_on: ERROR
# Mode-specific defaults come from .aimes/quality-profiles.yaml.
# Put only deliberate project overrides here; these values take precedence over profile defaults.
vue: {}
exclude:
  - "node_modules/**"
  - "dist/**"
  - "build/**"
  - ".venv/**"
  - "vendor/**"
